plugins {
    id 'com.android.application'
}

android {
    namespace 'com.batcontroller'
    compileSdk 33

    defaultConfig {
        applicationId "com.batcontroller"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 无外部依赖，使用系统原生 API
}
